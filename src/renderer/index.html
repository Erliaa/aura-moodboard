<!DOCTYPE html>
<html lang="it"><head><meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data: aura:; media-src 'self' blob: aura:; frame-src https://www.youtube.com https://open.spotify.com; font-src 'self' data:; worker-src 'self' blob:">
<link rel="stylesheet" href="style.css"><title>AURA moodboard</title></head>
<body>
<div id="dframe"></div>
<header id="bar">
  <div class="left">
    <button id="logo" title="Home"><svg viewBox="0 0 48 24" width="38" height="19" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round"><path d="M14 4C6 4 3 8 3 12s3 8 11 8c10 0 10-16 20-16 8 0 11 4 11 8s-3 8-11 8c-10 0-10-16-20-16"/></svg><span class="brand">AURA</span></button>
    <span class="slash">/</span><span id="tw"></span><div class="dz"></div>
  </div>
  <nav class="tabs"><button id="t-canvas">Tavola</button><i></i><button id="t-library">Raccolta Immagini</button></nav>
  <div class="rt"><div class="dz"></div><div class="win" id="win"></div></div>
</header>
<main>
  <section id="home" class="grid view"></section>
  <section id="canvas" class="view hidden">
    <div id="stage"></div>
    <div id="zoomlbl" title="Reimposta zoom">100%</div>
    <div id="toolbar"></div>
    <div id="props" class="hidden"></div>
    <div id="mp" class="hidden"></div>
    <div id="pop" class="hidden"></div>
  </section>
  <section id="library" class="grid view hidden"></section>
</main>
<div id="cdrag"></div><div id="swm" class="hidden"></div><div id="modal" class="hidden"></div><div id="ctx" class="hidden"></div><div id="toast" class="hidden"></div>
<script src="icons.js"></script><script src="app.js"></script><script src="player.js"></script><script src="extras.js"></script><script src="vector.js"></script><script src="touch.js"></script></body></html>
